<section class="space-y-8">
  <div class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
    <div class="space-y-2">
      <h2 class="repository-heading text-3xl">The Archive Table</h2>
      <p class="max-w-2xl text-base leading-7 text-neutral-800">
        Sort any column to inspect chronological drift, recurring failure classes, and unstable technical assumptions.
      </p>
    </div>
    <p class="text-xs uppercase tracking-[0.2em] text-neutral-700" id="sort-status">Sort: Date descending</p>
  </div>

  <div class="overflow-x-auto border border-black">
    <table class="w-full border-collapse text-left" id="archive-table">
      <thead>
        <tr class="border-b border-black bg-neutral-100">
          <th scope="col" class="min-w-40 border-r border-black px-4 py-3 text-xs font-semibold uppercase tracking-[0.15em]">
            <button type="button" class="sortable w-full text-left" data-sort-key="date">Date</button>
          </th>
          <th scope="col" class="min-w-56 border-r border-black px-4 py-3 text-xs font-semibold uppercase tracking-[0.15em]">
            <button type="button" class="sortable w-full text-left" data-sort-key="project">Project Name</button>
          </th>
          <th scope="col" class="min-w-48 border-r border-black px-4 py-3 text-xs font-semibold uppercase tracking-[0.15em]">
            <button type="button" class="sortable w-full text-left" data-sort-key="failureType">Failure Type</button>
          </th>
          <th scope="col" class="min-w-56 px-4 py-3 text-xs font-semibold uppercase tracking-[0.15em]">
            <button type="button" class="sortable w-full text-left" data-sort-key="technicalKey">Technical Key</button>
          </th>
        </tr>
      </thead>
      <tbody id="archive-tbody"></tbody>
    </table>
  </div>
</section>
