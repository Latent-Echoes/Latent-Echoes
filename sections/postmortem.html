<section class="grid gap-5" aria-label="Lab Notebook Detail View">
  <div class="space-y-1">
    <h2 class="repository-heading text-3xl">Lab Notebook</h2>
    <p class="max-w-3xl text-sm leading-6">
      Detail overlay for objective traces, bottleneck evidence, and present-day pivots.
    </p>
  </div>

  <article class="hairline p-5 md:p-6" id="postmortem-preview" aria-live="polite">
    <h3 class="repository-heading text-2xl">No Entry Selected</h3>
    <p class="mt-3 max-w-3xl text-sm leading-6">
      Open a registry row to inspect the Objective, Bottleneck, and Pivot notes.
    </p>
  </article>

  <dialog id="postmortem-dialog" class="w-[min(980px,95vw)] hairline bg-[color:var(--paper)] p-0 text-[color:var(--ink)]">
    <article class="space-y-8 p-5 md:p-8" id="postmortem-article">
      <header class="space-y-2 hairline-b pb-4">
        <p class="mono-id text-xs tracking-[0.15em]" id="pm-id"></p>
        <h3 class="repository-heading text-3xl" id="pm-title"></h3>
        <p class="text-xs uppercase tracking-[0.12em]" id="pm-meta"></p>
      </header>

      <section class="space-y-3">
        <h4 class="repository-heading text-xl">Objective</h4>
        <p class="leading-7" id="pm-objective"></p>
      </section>

      <section class="space-y-3">
        <h4 class="repository-heading text-xl">The Bottleneck</h4>
        <pre class="overflow-x-auto hairline bg-[color:var(--paper-soft)] p-4 text-sm leading-6"><code id="pm-bottleneck"></code></pre>
      </section>

      <section class="space-y-3">
        <h4 class="repository-heading text-xl">The Pivot</h4>
        <p class="leading-7" id="pm-pivot"></p>
      </section>

      <footer class="hairline-t pt-4">
        <button
          type="button"
          id="close-postmortem"
          class="hairline px-4 py-2 text-xs uppercase tracking-[0.15em] hover:bg-[color:var(--ink)] hover:text-[color:var(--paper)]"
        >
          Close Notebook
        </button>
      </footer>
    </article>
  </dialog>
</section>
